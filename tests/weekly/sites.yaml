request_interval_seconds: 1.0
max_retries: 4
sites:
  - id: fakt
    name: Fakt
    placeholder: false
    gsc_property: https://www.fakt.pl/
    base_url: https://www.fakt.pl/
    sitemap_url: null
    category_sitemaps: [https://www.fakt.pl/sitemap-categories.xml]
    brand_terms: [fakt.pl, fakt]
    thresholds: &default_thresholds
      clicks: {warn: 0.15, fail: 0.25}
      impressions: {warn: 0.15, fail: 0.25}
      ctr: {warn: 0.15, fail: 0.25}
      position: {warn: 0.15, fail: 0.25}
    representative_urls:
      home: https://www.fakt.pl/
      article: null
      category: null
    inspection_limit: 3
